backend:
  name: git-gateway
  branch: master

media_folder: "assets/blog"
public_folder: "/assets/blog"

site_url: https://www.vootkit.com
display_url: https://www.vootkit.com
logo_url: https://www.vootkit.com/assets/favicon.svg

publish_mode: simple

collections:
  - name: "blog"
    label: "Blog posts"
    label_singular: "Blog post"
    description: "Write and publish articles to the Vootkit blog."
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "yaml-frontmatter"
    preview_path: "blog/{{slug}}/"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Title", name: "title", widget: "string", hint: "The headline. Also becomes the page title and URL." }
      - { label: "Publish date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Short description", name: "description", widget: "text", hint: "1–2 sentences. Used for SEO and the blog card. Keep under ~155 characters." }
      - { label: "Cover image", name: "thumbnail", widget: "image", required: false, hint: "Ideally 1200×630. Shows on the post, the blog card, and social shares." }
      - { label: "Author", name: "author", widget: "string", default: "The Vootkit team", required: false }
      - { label: "Draft (hide from the live site)", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "Body", name: "body", widget: "markdown", hint: "Paste your article here. Supports headings, lists, links, images, bold/italic." }
