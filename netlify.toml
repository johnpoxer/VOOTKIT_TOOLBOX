# Netlify configuration for Vootkit (site e074cf0a-9974-4e84-ae5a-c8ca57b0a093)
# The site is a static build produced by `npm run build` (build.js). The
# generated _headers and _redirects files carry the per-path rules.

[build]
  publish = "."
  command = "npm run build"
  functions = "netlify/functions"

# Canonicalise the apex to www (matches the canonical URLs the build emits).
[[redirects]]
  from = "https://vootkit.com/*"
  to = "https://www.vootkit.com/:splat"
  status = 301
  force = true

# Short links: /s/<code> is served by the redirect function, which looks the
# code up in Supabase and 302s to the real destination.
[[redirects]]
  from = "/s/:code"
  to = "/.netlify/functions/redirect?code=:code"
  status = 200

# Serverless functions (Stripe Checkout) need their deps.
[functions]
  node_bundler = "esbuild"
